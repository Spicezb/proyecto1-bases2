services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "${APP_PORT}:3000"

    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV}

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + process.env.PORT + '/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s